[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 100
tab_width = 4

[rpc_endpoints]
rhc_testnet = "https://rpc.testnet.chain.robinhood.com"
rhc_mainnet = "https://rpc.mainnet.chain.robinhood.com"
