name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: sdk + web
    runs-on: ubuntu-latest

    # MemoryStore is the reference the Postgres store has to agree with, and
    # that is only worth anything if the agreement is actually checked. With no
    # database here the Postgres half of the suite skips and CI goes green
    # having run half the tests.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: parley_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every dist/ removed first. Packages resolve each other through dist/,
      # which is gitignored, so this is the state a cold clone is really in —
      # and the state that has now broken twice, once on Vercel and once here.
      # Anything that only passes with a warm dist/ fails on this line.
      - name: Typecheck from cold
        run: |
          rm -rf packages/*/dist
          pnpm typecheck

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/parley_test

      - name: Build without a prebuilt SDK
        run: |
          rm -rf packages/*/dist
          pnpm --filter @parley/web build

      - name: Build the agent runtimes
        run: |
          rm -rf packages/*/dist
          pnpm --filter @parley/daemon build
